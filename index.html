<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 导航 -->
  <nav class="navbar">
    <div class="logo">Portfolio</div>
    <div class="nav-menu">
      <a href="#cover">首页</a>
      <a href="#contents">目录</a>
      <a href="#works">作品</a>
      <a href="#about">关于</a>
    </div>
  </nav>

  <!-- 封面 Hero -->
  <section class="hero-cover fade-in" id="cover">
    <div class="hero-top-info">
      <h1>FIELD NOTES</h1>
      <p>Photography & Visual Portfolio</p>
    </div>
  </section>

  <!-- 目录 -->
  <section class="section-wrap fade-in" id="contents">
    <div class="container">
      <h2>目录</h2>
      <ul class="index-list">
        <li><a href="#works-01">作品 01</a></li>
        <li><a href="#works-02">作品 02</a></li>
        <li><a href="#works-03">作品 03</a></li>
      </ul>
    </div>
  </section>

  <!-- 作品区 -->
  <section class="section-wrap fade-in" id="works">
    <div class="container">
      <h2>作品</h2>
      <div class="work-item fade-in" id="works-01">
        <h3>项目标题一</h3>
        <p>这里放作品描述，大量留白，文字克制，适合影像、平面、文创作品集。</p>
      </div>
      <div class="work-item fade-in" id="works-02">
        <h3>项目标题二</h3>
        <p>黑白杂志质感，不花哨，高留白，偏纪实印刷感。</p>
      </div>
      <div class="work-item fade-in" id="works-03">
        <h3>项目标题三</h3>
        <p>图片直接放在这里，后续你自己加 img 标签即可。</p>
      </div>
    </div>
  </section>

  <!-- 关于 -->
  <section class="section-wrap fade-in" id="about">
    <div class="container">
      <h2>关于</h2>
      <p>简短自我介绍，干净克制，保持版面呼吸感。</p>
    </div>
  </section>

  <script src="sketch.js"></script>
</body>
</html>
